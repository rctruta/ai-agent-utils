[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-agent-utils"
version = "0.2.0"
description = "Developer toolkit for AI coding agents: git guardrails, agent contracts, and claim integrity gates."
readme = "README.md"
authors = [
    { name = "Ramona C. Truta" }
]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
